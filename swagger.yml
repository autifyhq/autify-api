---
openapi: 3.0.0
info:
  title: Autify API
  version: v1
  description: |
    ## Authorization
    You can authenticate the API by using a personal access token and passing it to the Bearer header. To generate or manage API keys、please visit [your account page](https://app.autify.com/settings).

    If the credentials are invalid or omitted, an error message is returned with status code 401：
    ```
    {
      "errors":[{
        "message": "Bad credentials"
      }]
    }
    ```
servers:
- url: https://app.autify.com/api/v1/
  description: Production server
paths:
  "/schedules/{schedule_id}":
    post:
      operationId: executeSchedule
      summary: Run a test plan.
      description: |
        "Schedule" is called as "Test Plan" now.\
        If you want to run a test plan, use this endpoint.
      tags:
      - schedule
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        description: 'For example, 3 for the following URL: https://app.autify.com/projects/1/test_plans/3

          '
        schema:
          type: integer
      requestBody:
        description: The options to execute a test plan.
        required: false
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/ExecuteScheduleRequest"
      responses:
        '200':
          description: |
            ok

            `123456` in the example response is the test plan result ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 123456
                      type:
                        type: string
                        example: test_plan_result
                      attributes:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 123456
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
        '401':
          description: Bad credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          default: Bad credentials
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          default: Not Found
  "/projects/{project_id}/scenarios":
    get:
      operationId: listScenarios
      description: 'List scenarios.

        '
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

          '
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The number of page returns.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Scenario"
  "/projects/{project_id}/scenarios/{scenario_id}":
    get:
      operationId: describeScenario
      description: |
        Get a scenario, with its steps, data table and variables.

        Each step names its keyword by the canonical English name that
        `listStepKeywords` publishes, and lists its arguments in that keyword's
        argument order. An argument that targets an element carries the locators
        Autify matches it by, rather than a placeholder.

        An `Execute Step Group` step is reported as a reference to its step group
        rather than expanded in place; read the group itself with this endpoint,
        using the `step_group_id` from the step's argument.

        A step recorded on a password field is masked: values typed into it are
        returned as `******` and the element's `candidate_locators` are withheld,
        as on `describeTestCaseResult`.
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      - name: scenario_id
        in: path
        required: true
        description: 'For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
    put:
      operationId: updateScenario
      description: 'Update a scenario.

        '
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      - name: scenario_id
        in: path
        required: true
        description: 'For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      requestBody:
        description: The scenario to update
        required: true
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/UpdateScenarioRequest"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        '400':
          description: |
            `on_create` was false and a label name this project does not have was
            supplied, or `on_create` was neither `true` nor `false`, or a label name
            the project would have to create is not a valid label name, or
            `version_token` was sent empty rather than omitted.
        '412':
          description: |
            The scenario changed after the version you named. Read the scenario again and
            retry against the `version_token` you get back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 412
                        message:
                          type: string
  "/projects/{project_id}/scenarios/{scenario_id}/duplications":
    post:
      operationId: duplicateScenario
      description: 'Duplicate a scenario.

        '
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      - name: scenario_id
        in: path
        required: true
        description: 'For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
  "/projects/{project_id}/scenarios/{scenario_id}/results":
    get:
      operationId: listScenarioResults
      summary: List the test results of one scenario.
      description: |
        List the test results of a single scenario, newest first.

        Each entry is one execution of that scenario on one capability, so a
        scenario run against three browsers contributes three entries. Use this
        to see how one scenario has been doing over time, which `listResults`
        cannot answer: that endpoint returns whole test plan executions and is
        filterable only by test plan.

        `review_needed` is the number of "Review needed" element warnings raised
        by that execution. A count that climbs over recent results means the
        scenario's element locators are drifting.
      tags:
      - result
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      - name: scenario_id
        in: path
        required: true
        description: 'For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

          '
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The number of page returns.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: The number of items returns. Default number is 30 and up to a
          maximum of 100
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ScenarioTestCaseResult"
  "/projects/{project_id}/results":
    get:
      operationId: listResults
      summary: List test results.
      description: 'List test results.

        '
      tags:
      - result
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/results

          '
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The number of page returns.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: The number of items returns. Default number is 30 and up to a
          maximum of 100
      - name: test_plan_id
        in: query
        required: false
        schema:
          type: integer
        description: Test plan ID used to filter results.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TestPlanResult"
  "/projects/{project_id}/results/{result_id}":
    get:
      operationId: describeResult
      summary: Get a test result.
      description: 'Get a test result.

        '
      tags:
      - result
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/results/4

          '
        schema:
          type: integer
      - name: result_id
        in: path
        required: true
        description: 'For example, 4 for the following URL: https://app.autify.com/projects/1/results/4

          '
        schema:
          type: integer
      - name: get_details
        in: query
        required: false
        description: 'The flag to get details of the test case result.

          '
        schema:
          type: boolean
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    "$ref": "#/components/schemas/TestPlanResultStatus"
                  duration:
                    type: integer
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  review_needed:
                    type: boolean
                  test_plan_capability_results:
                    type: array
                    items:
                      "$ref": "#/components/schemas/TestPlanCapabilityResult"
                  test_plan:
                    "$ref": "#/components/schemas/TestPlan"
  "/projects/{project_id}/test_case_results/{test_case_result_id}":
    get:
      operationId: describeTestCaseResult
      summary: Get the steps and element locators of a test case result.
      description: |
        Get the step-by-step breakdown of a single test case result, including the
        element locators Autify resolved for each step.

        A "test case result" is the execution of one scenario on one capability.
        You can obtain its ID from the `test_plan_capability_results[].test_case_results[].id`
        field returned by `describeResult`.

        Use this to see which step failed and why, and to read back the locators
        Autify generated for an element, which are usually better than a selector
        you would write by hand.

        Note: a step reports its keyword as `action_type`, the same enum
        `listStepKeywords` and `describeScenario` use, rather than as a name. The
        localized label the UI shows appears only in `describeResult` (`get_details`).

        Values typed into a password field are returned as `******`.
      tags:
      - result
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/results/4

          '
        schema:
          type: integer
      - name: test_case_result_id
        in: path
        required: true
        description: |
          The ID of the test case result. Obtainable from the `test_case_results[].id`
          field of `describeResult`.
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TestCaseResultDetail"
  "/projects/{project_id}/capabilities":
    get:
      operationId: listCapabilities
      description: 'List available Capabilities.

        '
      tags:
      - capability
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/capabilities

          '
        schema:
          type: integer
      - in: query
        name: os
        schema:
          type: string
        description: os name to filter (deprecated)
        deprecated: true
      - in: query
        name: os_type
        description: Type of the os to filter
        schema:
          "$ref": "#/components/schemas/OsTypeEnum"
      - in: query
        name: browser
        schema:
          type: string
        description: browser name to filter (deprecated)
        deprecated: true
      - in: query
        name: browser_type
        description: Type of the browser to filter
        schema:
          "$ref": "#/components/schemas/BrowserTypeEnum"
      - in: query
        name: device_type
        description: device_type name to filter (mobile is deprecated)
        schema:
          "$ref": "#/components/schemas/DeviceTypeEnum"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CapabilityOption"
  "/projects/{project_id}/step_keywords":
    get:
      operationId: listStepKeywords
      description: |
        List every step keyword an Autify NoCode Web scenario can be built from,
        with the ordered argument signature of each.

        Supply a step's arguments in the order `arguments` gives them. A keyword
        whose `included_in_plan` is false is not part of this workspace's plan, and
        writing a step that uses it is rejected; every keyword is listed either way,
        so the whole vocabulary is visible.

        `keyword` is the canonical English name and is what the rest of the API
        expects, whatever language the workspace is set to.
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

          '
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/StepKeyword"
  "/projects/{project_id}/execute_scenarios":
    post:
      operationId: executeScenarios
      description: 'You can execute any scenarios in your workspace using any execution
        environments (which is called "capabilities" here).

        '
      tags:
      - scenario
      security:
      - bearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        description: 'For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

          '
        schema:
          type: integer
      requestBody:
        description: The scenarios and settings to execute
        required: true
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/ExecuteScenariosRequest"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                "$ref": "#/components/schemas/ExecuteScenariosResult"
        '401':
          description: Bad credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 401
                        message:
                          type: string
                          default: Bad credentials
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 404
                        message:
                          type: string
                          default: Not Found
  "/projects/{project_id}/autify_connect/access_points":
    get:
      operationId: listAccessPoints
      description: 'List access points for the project.

        '
      tags:
      - autify_connect
      security:
