          type: integer
      - name: url_replacement_id
        in: path
        required: true
        description: 'url_replacement id

          '
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
                example: ok
  "/test_plans/{test_plan_id}/test_plan_variables":
