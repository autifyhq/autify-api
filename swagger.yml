      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/AccessPoint"
    post:
      operationId: createAccessPoint
      description: 'You can generate a new access point by passing in its name.

        '
      tags:
      - autify_connect
      security:
      - bearerAuth: []
