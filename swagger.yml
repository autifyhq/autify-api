    UpdateScenarioRequest:
      properties:
        version_token:
          type: string
          description: |
            The version of the scenario you are updating, as returned by `version_token`
            when you read it. The update is rejected with 412 if anyone changed the
            scenario's name, description or labels in between, so read it again and retry
            against the version you get back. Running the scenario does not change it. Sending an empty value is an error; omit the field entirely to update
            whatever is there without checking.
        name:
          type: string
        description:
          type: string
        labels:
          type: array
          description: |
            Label names, replacing the scenario's current labels. A name this project
            does not already have is created in it, unless `on_create` is false.

            Only this project's labels are matched, so a label of the same name in
            another project is never attached.
          items:
            type: string
        on_create:
          type: boolean
          default: true
          description: |
            Whether to create a label named in `labels` that this project does not
            have. Set it to false to have an unrecognised name rejected instead,
            which is the safer setting when a name may be a typo.

            Only `true` and `false` are accepted. Any other value is rejected with
            400 rather than being read as `true`, so a typo in this flag cannot
            silently turn label creation back on. A repeated name in `labels` is
            attached once. A name the project would have to create but that the
            label validations reject, such as one over 50 characters, is a 400
            carrying the validation message.
